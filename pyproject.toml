[project]
name = "skull"
version = "0.1.0"
description = "Terminal chat client for a Qwen endpoint with tool calling, self-created skills, and long-term memory."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "beautifulsoup4",
    "sentence-transformers",
    "numpy",
    "e2b-code-interpreter",
    "sqlite-vec>=0.1.9",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
