  <rect x="330" y="140" width="4" height="46" fill="url(#accent)"/>

  <text x="60" y="222" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#9aa5bd">a self-extending terminal agent for a self-hosted Qwen model</text>

  <circle cx="1010" cy="50" r="6" fill="#f7768e"/>
