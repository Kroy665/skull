[project]
name = "skull"
version = "0.1.0"
description = "Terminal chat client for a Qwen endpoint with tool calling, self-created skills, and long-term memory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "beautifulsoup4",
    "sentence-transformers",
    "numpy",
    "e2b-code-interpreter",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
